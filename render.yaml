services:
  - type: web
    name: internshield
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      # Public Firebase Web API key used by the backend to verify ID tokens.
      - key: FIREBASE_API_KEY
        sync: false
      # Admin role: comma-separated verified emails.
      - key: ADMIN_EMAILS
        sync: false
      # Optional standard admin credential (leave unset to disable).
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
